[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "user-analytics-dashboard"
version = "0.1.0"
description = "Interactive data exploration and analytics dashboard"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "scikit-learn",
    "plotly",
    "scipy",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
